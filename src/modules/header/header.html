<header class="header">
  <div class="header__logo no-select" onclick="scrollLink('#post-landing')">
    <img src="/images/uis/logo-barca-burguer.svg" alt="Barca Burguer" />
  </div>

  <div class="header__actions">
    <div class="header__actions__social no-select">
      <div class="insta-page">
        <a href="https://www.instagram.com/barcaburguersp/" target="_BLANK" rel="noopener noreferrer">
          <img src="/images/socials/ico_instagram.svg" />
        </a>
      </div>
  
      <div class="fb-page">
        <div class="fb-page__logo">
          <a href="https://www.facebook.com/abarcaburguer" target="_BLANK" rel="noopener noreferrer">
            <img src="/images/socials/ico_facebook.svg" />
          </a>
        </div>
      </div>
    </div>

    <div class="header__actions__side-nav">
      {{> side-nav }}
    </div>
  </div>
</header>
